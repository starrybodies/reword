name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REWORD_VOICE: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library core tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check public CLI version
        run: python scripts/reword.py --version
